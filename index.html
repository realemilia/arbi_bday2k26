<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Happy Birthday, Arbikutty 🌸</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;600&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#3a2a30}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:'Quicksand',system-ui,sans-serif;color:#fff;background:radial-gradient(ellipse at 80% 100%,#c9795a 0,#8a4a5c 25%,transparent 60%),linear-gradient(#2a1d2b,#4d3547 55%,#6b4150)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hero{position:fixed;left:6vw;top:16vh;max-width:min(560px,88vw);pointer-events:none}
h1{font-weight:300;font-size:clamp(38px,7.2vw,92px);line-height:1.05;margin:0 0 16px;text-shadow:0 4px 30px #0005}
#hero p{font-size:clamp(14px,1.6vw,18px);line-height:1.6;opacity:.85;max-width:340px;margin:0 0 18px}
.pill{pointer-events:auto;display:inline-flex;align-items:center;gap:10px;color:#fff;background:#ffffff1f;border:1px solid #ffffff40;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:40px;padding:12px 22px;font:600 15px 'Quicksand',sans-serif;cursor:pointer}
#top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);white-space:nowrap;z-index:3;pointer-events:none}
#tray{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:16px;overflow-x:auto;padding:12px 6vw 8px;scrollbar-width:none;z-index:3}
#tray::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:clamp(170px,22vw,250px);background:#fffdfb;color:var(--ink);border-radius:28px;padding:10px 10px 14px;cursor:pointer;box-shadow:0 14px 40px #0006;animation:fl 5s ease-in-out infinite;transition:transform .3s}
.card:nth-child(even){animation-delay:-2.5s}
.card:hover{transform:translateY(-6px)}
@keyframes fl{50%{translate:0 -7px}}
.ph{width:100%;aspect-ratio:4/3;border-radius:20px;background:linear-gradient(135deg,#ffd6e2,#e9b4c8) center/cover;display:flex;align-items:center;justify-content:center;font-size:13px;color:#8a5468}
.card small{display:block;margin:10px 8px 2px;font-size:12px;opacity:.55}
.card b{display:block;margin:0 8px;font-size:16px;font-weight:600}
.card.done{opacity:.72}
.card.done small::after{content:' ✓'}
.card.lock{background:#ffffff24;color:#fff;border:1px solid #ffffff44;backdrop-filter:blur(10px)}
.card.gold{background:linear-gradient(135deg,#fff3c4,#ffc863);animation:fl 3s ease-in-out infinite,gl 2s ease-in-out infinite}
@keyframes gl{50%{box-shadow:0 0 50px #ffd36e}}
#bf{position:fixed;font-size:30px;left:0;top:0;z-index:2;pointer-events:none;animation:bf 22s ease-in-out infinite}
@keyframes bf{0%{transform:translate(8vw,70vh) rotate(10deg)}25%{transform:translate(40vw,38vh) rotate(-15deg)}50%{transform:translate(66vw,52vh) rotate(20deg)}75%{transform:translate(52vw,24vh) rotate(-10deg)}100%{transform:translate(8vw,70vh) rotate(10deg)}}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:#1a0f2acc;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .5s;z-index:9}
.ov.hide{opacity:0;pointer-events:none}
.box{max-width:440px;width:100%;max-height:90%;overflow:auto;background:#fffdfb;color:var(--ink);border-radius:32px;padding:14px 14px 22px;text-align:center;box-shadow:0 30px 80px #000a}
.box .ph{aspect-ratio:4/3;border-radius:22px}
.box h2{font-weight:600;font-size:24px;margin:16px 10px 8px}
.box p{line-height:1.7;margin:0 14px 16px;white-space:pre-line;font-size:16px}
.box button{font:600 16px 'Quicksand',sans-serif;color:#fff;background:linear-gradient(#e56c93,#c24a73);border:0;border-radius:30px;padding:12px 32px;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top" class="pill">🌸 for Arbikutty · <span id="cnt">0 / 5</span></div>
<div id="hero">
  <h1>Happy Birthday,<br>Arbikutty</h1>
  <p>I grew a little blossom tree for you. Every card below holds a memory of us.</p>
  <button class="pill" id="start">✦ Open our first memory</button>
</div>
<div id="bf">🦋</div>
<div id="tray"></div>
<div class="ov hide" id="modal"><div class="box" id="mc"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ====== EDIT THIS PART ====== */
const NAME="Arbikutty";
// photo: a data: URI, or "" for a placeholder
const MEMORIES=[
 {t:"Our Bus Rides",d:"The bus rides we took together... you would fall asleep in my arms until your stop came. Those were the quietest, safest minutes of my day.",photo:"images/photo1.jpg"},
 {t:"Where Long Distance Began",d:"The start of our long distance. It was hard, but it taught us that we choose each other every single day.",photo:"images/photo2.jpg"},
 {t:"Our Little Restaurant Date",d:"Our mini date at the restaurant. Simple food, big smiles, and me not being able to look away from you.",photo:"images/photo3.jpg"},
 {t:"A Perfect Day",d:"Our first perfect date on the beach, and our first bike ride together... we were so close, and I never wanted that day to end.",photo:"images/photo4.jpg"},
 {t:"Vavubali",d:"You were mad at me, but you still cared so much, and I cared just as much. Then came the goodbye as we went back to long distance. It hurt, and it showed me how much we mean to each other.",photo:"images/photo5.png"}
];
const FINAL_PHOTO="images/photo6.png";
const FINAL_MESSAGE=`My dearest ${NAME},

Happy Birthday, my love! 🎂

Every bus ride, every beach, every goodbye taught me one thing: distance can't touch what we have. You are the first person I think of every morning and the last one every night.

On your special day I wish yoy to be always happy and healthy and blessed always forever, and I promise you that I will always be there for you, no matter what. I can't wait to see you again and make more memories together.

The next time we meet, i would not let you go and will be hugging and kissing you a lot.

I love you more than any distance can hold.

Forever yours,
Advaith ❤️`;
/* ====== END EDIT ====== */

const $=id=>document.getElementById(id),rnd=(a,b)=>a+Math.random()*(b-a),gs=()=>(Math.random()+Math.random()+Math.random()-1.5)/1.5;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ---- Three.js scene ---- */
const R=new THREE.WebGLRenderer({canvas:$('c'),alpha:true,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene(),portrait=innerWidth/innerHeight<1;
const cam=new THREE.PerspectiveCamera(50,1,.1,100);cam.position.z=portrait?13:9;
function fit(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}fit();addEventListener('resize',fit);
S.add(new THREE.AmbientLight(0xffd9e0,.85));
const sun=new THREE.DirectionalLight(0xffb27a,1.2);sun.position.set(4,3,6);S.add(sun);

function tex(w,fn){const k=document.createElement('canvas');k.width=k.height=w;fn(k.getContext('2d'),w);return new THREE.CanvasTexture(k)}
const flower=tex(128,(x,s)=>{x.translate(s/2,s/2);for(let i=0;i<5;i++){x.save();x.rotate(i*1.2566);const g=x.createRadialGradient(0,-s*.3,2,0,-s*.2,s*.3);g.addColorStop(0,'#ffffff');g.addColorStop(.55,'#ffe0ea');g.addColorStop(1,'#f59ab8');x.fillStyle=g;x.beginPath();x.moveTo(0,-s*.04);x.bezierCurveTo(-s*.26,-s*.2,-s*.2,-s*.46,-s*.04,-s*.44);x.lineTo(0,-s*.38);x.lineTo(s*.04,-s*.44);x.bezierCurveTo(s*.2,-s*.46,s*.26,-s*.2,0,-s*.04);x.fill();x.restore()}
 x.strokeStyle='#d6366b';x.lineWidth=1.2;for(let i=0;i<9;i++){const a=i*.7;x.beginPath();x.moveTo(0,0);x.lineTo(Math.cos(a)*s*.11,Math.sin(a)*s*.11);x.stroke();x.fillStyle='#ffd35c';x.beginPath();x.arc(Math.cos(a)*s*.11,Math.sin(a)*s*.11,2,0,7);x.fill()}x.fillStyle='#d6366b';x.beginPath();x.arc(0,0,s*.025,0,7);x.fill()});
const petal=tex(64,(x,s)=>{const g=x.createRadialGradient(s/2,s/2,2,s/2,s/2,s*.4);g.addColorStop(0,'#fff0f4');g.addColorStop(1,'#f7a3bf');x.fillStyle=g;x.translate(s/2,s/2);x.rotate(.6);x.beginPath();x.ellipse(0,0,s*.17,s*.34,0,0,7);x.fill()});
const barkT=tex(256,(x,s)=>{x.fillStyle='#3d2e2c';x.fillRect(0,0,s,s);for(let i=0;i<260;i++){x.fillStyle=`rgba(${rnd(20,50)|0},${rnd(15,40)|0},${rnd(15,35)|0},.5)`;x.fillRect(rnd(0,s),rnd(0,s),rnd(2,30),rnd(1,4))}for(let i=0;i<110;i++){x.fillStyle=`rgba(${rnd(70,110)|0},${rnd(95,125)|0},40,${rnd(.2,.55)})`;x.beginPath();x.arc(rnd(0,s),rnd(0,s*.5),rnd(4,16),0,7);x.fill()}});
barkT.wrapS=barkT.wrapT=THREE.RepeatWrapping;barkT.repeat.set(10,1);
const bark=new THREE.MeshLambertMaterial({map:barkT});

const P=portrait?[[-3.4,-1.2,0],[-1.6,-.5,.5],[0,0,0],[1.6,.7,.3],[3.6,1.5,0]]:[[-8,-3.2,0],[-4.5,-2.5,.5],[0,-1.8,0],[4,-.9,.3],[8,0,0]];
const curve=new THREE.CatmullRomCurve3(P.map(p=>new THREE.Vector3(...p)));
const tube=(c,r,seg)=>{const g=new THREE.TubeGeometry(c,seg,r,8);const m=new THREE.Mesh(g,bark);S.add(m);return m};
tube(curve,portrait?.2:.34,80);
const HUBS=16,perHub=portrait?42:55,small=[];
for(let k=0;k<HUBS;k++){
 const t=.02+.96*k/(HUBS-1)+rnd(-.02,.02),b=curve.getPoint(t),down=k%3===1;
 const h=b.clone().add(new THREE.Vector3(gs()*.6,(down?-1:1)*rnd(.3,1.1)*(portrait?.8:1),rnd(-.3,.8)));
 tube(new THREE.CatmullRomCurve3([b,b.clone().lerp(h,.5).add(new THREE.Vector3(0,.12,0)),h]),portrait?.035:.06,10);
 const rad=portrait?.7:1.05;
 for(let i=0;i<perHub;i++){
  const m=new THREE.SpriteMaterial({map:flower,rotation:rnd(0,6.3),color:new THREE.Color().setHSL(rnd(.93,.99),rnd(.5,.9),rnd(.84,.97)),depthWrite:false});
  const s=new THREE.Sprite(m),z=rnd(-.9,1.4);
  s.position.set(h.x+gs()*rad,h.y+gs()*rad*.8,h.z+z);
  const sc=(portrait?.26:.34)*rnd(.7,1.35)*(1+z*.12);s.scale.set(sc,sc,1);s.userData={sc,ph:rnd(0,6.3),sp:rnd(.8,1.8)};S.add(s);small.push(s);
 }
}
// falling petals
const pet=[];
for(let i=0;i<110;i++){const big=i%9===0,m=new THREE.SpriteMaterial({map:petal,rotation:rnd(0,6.3),opacity:big?.55:.95,depthWrite:false});
 const s=new THREE.Sprite(m),sz=big?rnd(.45,.8):rnd(.12,.34);s.scale.set(sz,sz*1.3,1);
 s.position.set(rnd(-9,9),rnd(-6,6),big?rnd(2,4):rnd(-2,3));s.userData={fall:rnd(.006,.02)*(big?1.4:1),vy:0,vx:0,bx:rnd(.002,.008),sp:rnd(-.03,.03),ph:rnd(0,6.3)};S.add(s);pet.push(s)}
function burst(){pet.forEach(p=>{p.position.set(rnd(-1,1),rnd(-1,1),rnd(0,3));const a=rnd(0,6.28),v=rnd(.05,.2);p.userData.vx=Math.cos(a)*v;p.userData.vy=-Math.abs(Math.sin(a))*v-.05})}

let px=0,py=0;addEventListener('pointermove',e=>{px=e.clientX/innerWidth-.5;py=e.clientY/innerHeight-.5});
const clk=new THREE.Clock();
(function loop(){const t=clk.getElapsedTime();
 small.forEach(s=>{const k=1+.05*Math.sin(t*s.userData.sp+s.userData.ph);s.scale.set(s.userData.sc*k,s.userData.sc*k,1)});
 const wy=portrait?7:6.5,wx=portrait?4:9.5;
 pet.forEach(p=>{const u=p.userData;u.vx+=(u.bx-u.vx)*.03;u.vy+=(u.fall-u.vy)*.03;p.position.x+=u.vx+Math.sin(t*.8+u.ph)*.006;p.position.y-=u.vy;p.material.rotation+=u.sp;
  if(p.position.y<-wy||Math.abs(p.position.x)>wx+4){p.position.set(rnd(-wx,wx),wy,rnd(-2,3));u.vx=u.bx;u.vy=u.fall}});
 cam.position.x+=(px*1.1-cam.position.x)*.04;cam.position.y+=(-py*.6-cam.position.y)*.04;cam.lookAt(0,0,0);
 R.render(S,cam);requestAnimationFrame(loop)})();

/* ---- UI ---- */
let found=0;const done=new Set(),tray=$('tray');
function build(){tray.innerHTML='';
 MEMORIES.forEach((m,i)=>{const c=document.createElement('div');c.className='card'+(done.has(i)?' done':'');
  c.innerHTML=`<div class="ph" style="${m.photo?`background-image:url('${m.photo}')`:''}">${m.photo?'':'📷'}</div><small>Memory 0${i+1}</small><b>${esc(m.t)}</b>`;
  c.onclick=()=>show(i);tray.appendChild(c)});
 const f=document.createElement('div'),open=found===MEMORIES.length;
 f.className='card '+(open?'gold':'lock');
 f.innerHTML=open?`<div class="ph" style="background:#fff3c4">💌</div><small>One last thing</small><b>A message for you</b>`:`<div class="ph" style="background:#ffffff1a;color:#fff">🔒</div><small style="opacity:.8">Locked</small><b>Open every memory first</b>`;
 f.onclick=()=>{if(open)show(99)};tray.appendChild(f);
 $('cnt').textContent=`${found} / ${MEMORIES.length}`}
function show(i){const fin=i===99,m=fin?{t:"For You, Always",d:FINAL_MESSAGE,photo:FINAL_PHOTO}:MEMORIES[i];
 $('mc').innerHTML=`<div class="ph" style="${m.photo?`background-image:url('${m.photo}')`:''}">${m.photo?'':'📷 your photo goes here'}</div><h2>${esc(m.t)}</h2><p>${esc(m.d)}</p><button id="x">${fin?'💗 I love you':'Close'}</button>`;
 $('modal').classList.remove('hide');if(fin)burst();
 $('x').onclick=()=>{$('modal').classList.add('hide');if(!fin&&!done.has(i)){done.add(i);found++;build()}}}
$('start').onclick=()=>show(0);
build();
</script>
</body>
</html>
